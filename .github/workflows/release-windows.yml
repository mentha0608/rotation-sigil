name: Release Windows app

on:
  push:
    branches: [main]
    paths: [src-tauri/tauri.conf.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Windows installer
        run: npx tauri build --bundles nsis
      - name: Upload installer to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*.exe'
          if (@($installer).Count -ne 1) { throw 'Expected one Windows installer' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer.FullName
          } else {
            gh release create $tag $installer.FullName --target "$env:GITHUB_SHA" --title "Rotation Sigil $tag" --generate-notes
          }
          exit $LASTEXITCODE
